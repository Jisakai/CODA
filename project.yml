name: coda

options:
  bundleIdPrefix: com.coda
  deploymentTarget:
    iOS: "27.2"
  createIntermediateGroups: true

settingGroups:
  CodaNativeHeaders:
    # Static-library dependencies do not propagate Clang module search paths.
    # Discover module.modulemap in-place, plus coda_transport.h's DSP dependency.
    HEADER_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/Sources/CodaTransport/include"
      - "$(SRCROOT)/CodaDSP/include"

targets:
  coda:
    type: application
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Sources/CodaApp
      - path: Sources/CodaMusic/Resources/vocab.json
        buildPhase: resources
      - path: Fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Light.ttf
        buildPhase: resources
      - path: Fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Regular.ttf
        buildPhase: resources
      - path: Fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Medium.ttf
        buildPhase: resources
      - path: Fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-SemiBold.ttf
        buildPhase: resources
      - path: Fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Bold.ttf
        buildPhase: resources
      - path: Fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-ExtraBold.ttf
        buildPhase: resources
      - path: Fonts/Plus_Jakarta_Sans/OFL.txt
        buildPhase: resources
    dependencies:
      - target: CodaMusic
      - target: CodaSidekick
      - target: CodaInteraction
      - target: CodaSession
      - target: CodaNative
      - sdk: libc++.tbd
    settings:
      groups: [CodaNativeHeaders]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coda.sketchpad
        PRODUCT_NAME: coda
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.2"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
    info:
      path: build/generated/coda-Info.plist
      properties:
        CFBundleDisplayName: coda
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Coda
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CodaSceneDelegate
        UIAppFonts:
          - PlusJakartaSans-Light.ttf
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  CodaMusic:
    type: library.static
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Sources/CodaMusic
        excludes:
          - Resources
    settings:
      base:
        PRODUCT_NAME: CodaMusic
        PRODUCT_MODULE_NAME: CodaMusic
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.2"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO

  CodaMusicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Tests/CodaMusicTests
      - path: Sources/CodaMusic/Resources/vocab.json
        buildPhase: resources
    dependencies:
      - target: CodaMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coda.music.tests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.2"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO

    info:
      path: build/generated/CodaMusicTests-Info.plist

  CodaSidekick:
    type: library.static
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Sources/CodaSidekick
    dependencies:
      - target: CodaMusic
    settings:
      base:
        PRODUCT_NAME: CodaSidekick
        PRODUCT_MODULE_NAME: CodaSidekick
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.2"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO

  CodaSidekickTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Tests/CodaSidekickTests
      - path: Sources/CodaMusic/Resources/vocab.json
        buildPhase: resources
    dependencies:
      - target: CodaSidekick
      - target: CodaMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coda.sidekick.tests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.2"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
    info:
      path: build/generated/CodaSidekickTests-Info.plist

  CodaInteraction:
    type: library.static
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Sources/CodaInteraction
    settings:
      base:
        PRODUCT_NAME: CodaInteraction
        PRODUCT_MODULE_NAME: CodaInteraction
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.2"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO

  CodaInteractionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Tests/CodaInteractionTests
      - path: Sources/CodaMusic/Resources/vocab.json
        buildPhase: resources
    dependencies:
      - target: CodaInteraction
      - target: CodaMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coda.interaction.tests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.2"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
    info:
      path: build/generated/CodaInteractionTests-Info.plist

  CodaNative:
    type: library.static
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Sources/CodaTransport
        excludes:
          - include
      - path: Sources/CodaTransport/include/coda_transport.h
        headerVisibility: public
      - path: Sources/CodaTransport/include/CodaAudioAdapter.h
        headerVisibility: public
      - path: CodaDSP/src
      - path: CodaDSP/include/coda_dsp.h
        headerVisibility: public
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: libc++.tbd
    settings:
      groups: [CodaNativeHeaders]
      base:
        PRODUCT_MODULE_NAME: CodaNative
        DEFINES_MODULE: YES
        MODULEMAP_FILE: $(SRCROOT)/Sources/CodaTransport/include/module.modulemap
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_ENABLE_OBJC_ARC: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO

  CodaSession:
    type: library.static
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Sources/CodaSession
    dependencies:
      - target: CodaMusic
      - target: CodaNative
    settings:
      groups: [CodaNativeHeaders]
      base:
        PRODUCT_MODULE_NAME: CodaSession
        DEFINES_MODULE: YES
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO

  CodaAudioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Tests/CodaAudioTests
      # Compile the actual editor model and UI views into the offline integration-test target.
      - path: Sources/CodaApp
        excludes:
          - CodaApp.swift
      - path: Sources/CodaMusic/Resources/vocab.json
        buildPhase: resources
    dependencies:
      - target: CodaNative
      - target: CodaSession
      - target: CodaMusic
      - target: CodaSidekick
      - target: CodaInteraction
      - sdk: libc++.tbd
    settings:
      groups: [CodaNativeHeaders]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coda.audio.tests
        SWIFT_VERSION: "6.0"
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_ENABLE_OBJC_ARC: YES
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: build/generated/CodaAudioTests-Info.plist

  codaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Tests/CodaUITests
    dependencies:
      - target: coda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coda.sketchpad.UITests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.2"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO

schemes:
  coda:
    build:
      targets:
        coda: all
    test:
      config: Debug
      targets:
        - codaUITests
        - CodaMusicTests
        - CodaSidekickTests
        - CodaInteractionTests
        - CodaAudioTests
  CodaMusic:
    build:
      targets:
        CodaMusic: all
    test:
      config: Debug
      targets:
        - CodaMusicTests
