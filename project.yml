name: coda

options:
  bundleIdPrefix: com.coda
  deploymentTarget:
    iOS: "27.2"
  createIntermediateGroups: true

targets:
  coda:
    type: application
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Sources/CodaApp
      - path: Sources/CodaMusic/Resources/vocab.json
        buildPhase: resources
      - path: Fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Light.ttf
        buildPhase: resources
      - path: Fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Regular.ttf
        buildPhase: resources
      - path: Fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Medium.ttf
        buildPhase: resources
      - path: Fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-SemiBold.ttf
        buildPhase: resources
      - path: Fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Bold.ttf
        buildPhase: resources
      - path: Fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-ExtraBold.ttf
        buildPhase: resources
      - path: Fonts/Plus_Jakarta_Sans/OFL.txt
        buildPhase: resources
    dependencies:
      - target: CodaMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coda.sketchpad
        PRODUCT_NAME: coda
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.2"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
    info:
      path: build/generated/coda-Info.plist
      properties:
        CFBundleDisplayName: coda
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Coda
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CodaSceneDelegate
        UIAppFonts:
          - PlusJakartaSans-Light.ttf
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  CodaMusic:
    type: library.static
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Sources/CodaMusic
        excludes:
          - Resources
    settings:
      base:
        PRODUCT_NAME: CodaMusic
        PRODUCT_MODULE_NAME: CodaMusic
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.2"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO

  CodaMusicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Tests/CodaMusicTests
      - path: Sources/CodaMusic/Resources/vocab.json
        buildPhase: resources
    dependencies:
      - target: CodaMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coda.music.tests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.2"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO

    info:
      path: build/generated/CodaMusicTests-Info.plist

  codaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Tests/CodaUITests
    dependencies:
      - target: coda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coda.sketchpad.UITests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.2"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO

schemes:
  coda:
    build:
      targets:
        coda: all
    test:
      config: Debug
      targets:
        - codaUITests
        - CodaMusicTests
  CodaMusic:
    build:
      targets:
        CodaMusic: all
    test:
      config: Debug
      targets:
        - CodaMusicTests
