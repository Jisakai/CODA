name: Coda unsigned iPad IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coda-unsigned-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Assert the required Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "Expected Xcode 27.2 at $DEVELOPER_DIR; the xcode-27 image changed." >&2
            exit 1
          fi
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [[ "$xcode_version" != "27.2" || "$sdk_version" != "27.2" ]]; then
            echo "Required Xcode/iOS SDK: 27.2/27.2; found $xcode_version/$sdk_version." >&2
            echo "Update the pinned runner and minimum deployment target only after verifying Apple's current stable toolchain." >&2
            exit 1
          fi
          printf 'Xcode %s; iOS SDK %s\n' "$xcode_version" "$sdk_version" | tee build-toolchain.txt

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version | tee xcodegen-version.txt

      - name: Generate the Xcode project
        run: |
          mkdir -p build/generated
          xcodegen generate --spec project.yml
          mkdir -p build/artifacts

      - name: Verify scaffold and font metadata
        run: python3 -m unittest discover -s Tests/Scaffold -p 'test_*.py' -v

      - name: Build and test portable DSP core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/generated/dsp
          clang++ -std=c++20 -O2 -Wall -Wextra -pthread -dynamiclib \
            CodaDSP/tests/lock_hooks.cpp -Wl,-install_name,@rpath/libcoda_lock_hooks.dylib \
            -o build/generated/dsp/libcoda_lock_hooks.dylib
          clang++ -std=c++20 -O2 -Wall -Wextra -pthread \
            -I CodaDSP/include \
            CodaDSP/src/coda_dsp.cpp CodaDSP/tests/dsp_tests.cpp \
            -L build/generated/dsp -lcoda_lock_hooks -Wl,-rpath,@executable_path \
            -o build/generated/dsp/dsp_tests
          build/generated/dsp/dsp_tests build/generated/dsp/four-bar \
            | tee build/generated/dsp/DSP-verification.txt

      - name: Build and run DSP sanitizers
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O1 -g -Wall -Wextra -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -dynamiclib \
            CodaDSP/tests/lock_hooks.cpp -Wl,-install_name,@rpath/libcoda_lock_hooks_sanitized.dylib \
            -o build/generated/dsp/libcoda_lock_hooks_sanitized.dylib
          clang++ -std=c++20 -O1 -g -Wall -Wextra -pthread -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I CodaDSP/include CodaDSP/src/coda_dsp.cpp CodaDSP/tests/dsp_tests.cpp \
            -L build/generated/dsp -lcoda_lock_hooks_sanitized -Wl,-rpath,@executable_path \
            -o build/generated/dsp/dsp_tests_sanitized
          # Apple's runtime rejects LeakSanitizer; retain address/UB checks.
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            build/generated/dsp/dsp_tests_sanitized

      - name: Test production transport and sanitizers
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          mkdir -p build/generated/transport
          clang++ -std=c++20 -O2 -Wall -Wextra -pthread \
            -I CodaDSP/include -I Sources/CodaTransport/include -I Sources/CodaTransport \
            CodaDSP/src/coda_dsp.cpp Sources/CodaTransport/coda_transport.cpp \
            Tests/CodaTransportTests/transport_tests.cpp -o build/generated/transport/transport_tests
          build/generated/transport/transport_tests
          clang++ -std=c++20 -O1 -g -Wall -Wextra -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I CodaDSP/include -I Sources/CodaTransport/include -I Sources/CodaTransport \
            CodaDSP/src/coda_dsp.cpp Sources/CodaTransport/coda_transport.cpp \
            Tests/CodaTransportTests/transport_tests.cpp -o build/generated/transport/transport_tests_sanitized
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            build/generated/transport/transport_tests_sanitized

      - name: Prepare exact iPadOS 27.2 simulator destination
        shell: bash
        run: |
          set -euo pipefail
          device_name='iPad Pro 13-inch (M5)'
          runtime='com.apple.CoreSimulator.SimRuntime.iOS-27-2'
          devices="$(xcrun simctl list devices --json)"
          matches="$(python3 -c 'import json,sys; data=json.load(sys.stdin); runtime=sys.argv[1]; name=sys.argv[2]; found=[d for r,ds in data["devices"].items() if r == runtime for d in ds if d["name"] == name]; print("\n".join(d["udid"]+"\t"+d["state"] for d in found))' "$runtime" "$device_name" <<<"$devices")"
          count="$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$count" != 1 ]]; then
            echo "Expected exactly one $device_name on $runtime; found $count." >&2
            exit 1
          fi
          IFS=$'\t' read -r udid state <<<"$matches"
          if [[ "$state" != 'Booted' ]]; then
            xcrun simctl boot "$udid"
          fi
          xcrun simctl bootstatus "$udid" -b

      - name: Run combined M1 music, audio, input and UI suite
        id: m1-tests
        shell: bash
        # Cold simulator app launch exceeded 60s; keep per-test timeouts bounded.
        run: >-
          xcodebuild test
          -project coda.xcodeproj
          -scheme coda
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 180
          -maximum-test-execution-time-allowance 240
          -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=27.2'
          -resultBundlePath build/generated/coda-m1-tests.xcresult
          CODE_SIGNING_ALLOWED=NO

      - name: Export only named M1 review screenshots
        if: ${{ !cancelled() && steps.m1-tests.outcome != 'skipped' }}
        shell: bash
        env:
          M1_TEST_OUTCOME: ${{ steps.m1-tests.outcome }}
        run: |
          set -euo pipefail
          mkdir -p build/generated/ui-attachments
          xcrun xcresulttool export attachments \
            --path build/generated/coda-m1-tests.xcresult \
            --output-path build/generated/ui-attachments
          set --
          if [[ "$M1_TEST_OUTCOME" != "success" ]]; then
            set -- --allow-missing-review
          fi
          python3 scripts/export_ui_screenshots.py \
            --source build/generated/ui-attachments \
            --destination build/artifacts/ui-screenshots "$@"

      - name: Upload named M1 UI diagnostics even after test failure
        if: ${{ !cancelled() && steps.m1-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coda-m1-ui-diagnostics
          path: |
            build/generated/ui-attachments/manifest.json
            build/artifacts/ui-screenshots/M1-empty-editor.png
            build/artifacts/ui-screenshots/M1-four-bar-fixture.png
            build/artifacts/ui-screenshots/M1-synth-drawer.png
            build/artifacts/ui-screenshots/M1-radial-edge-fixture.png
            build/artifacts/ui-screenshots/M1-radial-primary-fixture.png
            build/artifacts/ui-screenshots/M1-diagnostic-*.png
            build/artifacts/ui-screenshots/M1-settings-appSettings-coordinate-center-before-assertion.png
            build/artifacts/ui-screenshots/M1-settings-appSettings-coordinate-center-AX-before-assertion.txt
            build/artifacts/ui-screenshots/M1-settings-appSettings-coordinate-left-padding-before-assertion.png
            build/artifacts/ui-screenshots/M1-settings-appSettings-coordinate-left-padding-AX-before-assertion.txt
            build/artifacts/ui-screenshots/M1-settings-appSettings-coordinate-bottom-padding-before-assertion.png
            build/artifacts/ui-screenshots/M1-settings-appSettings-coordinate-bottom-padding-AX-before-assertion.txt
            build/artifacts/ui-screenshots/M1-settings-appSettings-invoking-control-before-assertion.png
            build/artifacts/ui-screenshots/M1-settings-appSettings-invoking-control-AX-before-assertion.txt
            build/artifacts/ui-screenshots/M1-settings-projectSettings-coordinate-center-before-assertion.png
            build/artifacts/ui-screenshots/M1-settings-projectSettings-coordinate-center-AX-before-assertion.txt
            build/artifacts/ui-screenshots/M1-settings-projectSettings-coordinate-left-padding-before-assertion.png
            build/artifacts/ui-screenshots/M1-settings-projectSettings-coordinate-left-padding-AX-before-assertion.txt
            build/artifacts/ui-screenshots/M1-settings-projectSettings-coordinate-bottom-padding-before-assertion.png
            build/artifacts/ui-screenshots/M1-settings-projectSettings-coordinate-bottom-padding-AX-before-assertion.txt
            build/artifacts/ui-screenshots/M1-settings-projectSettings-invoking-control-before-assertion.png
            build/artifacts/ui-screenshots/M1-settings-projectSettings-invoking-control-AX-before-assertion.txt
            build/artifacts/ui-screenshots/M1-settings-keyScale-invoking-control-before-assertion.png
            build/artifacts/ui-screenshots/M1-settings-keyScale-invoking-control-AX-before-assertion.txt
            build/artifacts/ui-screenshots/M1-settings-tempo-invoking-control-before-assertion.png
            build/artifacts/ui-screenshots/M1-settings-tempo-invoking-control-AX-before-assertion.txt
            build/artifacts/ui-screenshots/M1-settings-appSettings-invoking-control-snapshot-before-assertion.png
            build/artifacts/ui-screenshots/M1-settings-appSettings-invoking-control-snapshot-AX-before-assertion.txt
            build/artifacts/ui-screenshots/M1-settings-projectSettings-invoking-control-snapshot-before-assertion.png
            build/artifacts/ui-screenshots/M1-settings-projectSettings-invoking-control-snapshot-AX-before-assertion.txt
            build/artifacts/ui-screenshots/M1-settings-keyScale-invoking-control-snapshot-before-assertion.png
            build/artifacts/ui-screenshots/M1-settings-keyScale-invoking-control-snapshot-AX-before-assertion.txt
            build/artifacts/ui-screenshots/M1-settings-tempo-invoking-control-snapshot-before-assertion.png
            build/artifacts/ui-screenshots/M1-settings-tempo-invoking-control-snapshot-AX-before-assertion.txt
            build/artifacts/ui-screenshots/M1-mute-restore-before-assertion.png
            build/artifacts/ui-screenshots/M1-mute-restore-AX-before-assertion.txt
          if-no-files-found: error
          retention-days: 7

      - name: Archive unsigned device app
        run: >-
          xcodebuild archive
          -project coda.xcodeproj
          -scheme coda
          -destination 'generic/platform=iOS'
          -archivePath build/coda.xcarchive
          CODE_SIGNING_ALLOWED=NO

      - name: Package and verify App.ipa
        shell: bash
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          xcodegen_version="$(xcodegen --version)"
          python3 scripts/package_ipa.py \
            --archive build/coda.xcarchive \
            --output-dir build/artifacts \
            --xcode-version "$xcode_version" \
            --ios-sdk-version "$sdk_version" \
            --xcodegen-version "$xcodegen_version"

      - name: Upload only the IPA and verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coda-unsigned-ipa
          path: |
            build/artifacts/App.ipa
            build/artifacts/App-verification.txt
            build/generated/dsp/DSP-verification.txt
            build/artifacts/ui-screenshots/M1-empty-editor.png
            build/artifacts/ui-screenshots/M1-four-bar-fixture.png
            build/artifacts/ui-screenshots/M1-synth-drawer.png
            build/artifacts/ui-screenshots/M1-radial-edge-fixture.png
            build/artifacts/ui-screenshots/M1-radial-primary-fixture.png
          if-no-files-found: error
          retention-days: 7
